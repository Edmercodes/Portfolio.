<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certifications</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: var(--blue-1);
      margin: 0;
      padding: 2rem;
      text-align: center;
      font-family: 'Poppins', sans-serif;
    }

    h2 {
      color: var(--blue-5);
      margin-bottom: 2rem;
    }

    .cert-gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
    }

    .cert-card {
      background-color: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      backdrop-filter: blur(6px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      width: 320px;
      max-width: 90%;
    }

    .cert-card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0, 115, 230, 0.4);
    }

    .cert-card img {
      width: 100%;
      height: auto;
      border-bottom: 3px solid var(--blue-3);
    }

    .cert-card p {
      color: white;
      font-weight: 500;
      padding: 1rem;
      margin: 0;
      background: linear-gradient(135deg, var(--blue-3), var(--blue-5));
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }

    .back-button {
      display: inline-block;
      margin-top: 2rem;
      text-decoration: none;
      background-color: var(--blue-4);
      color: white;
      padding: 0.8rem 1.6rem;
      border-radius: 6px;
      font-weight: bold;
      transition: 0.3s;
    }

    .back-button:hover {
      background-color: var(--blue-5);
    }

    footer {
      margin-top: 3rem;
      color: white;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <h2>🏅 My Certifications</h2>

  <div class="cert-gallery">
    <div class="cert-card">
      <img src="cert1.jpg" alt="Certificate 1">
      <p>Web Development Fundamentals</p>
    </div>

    <div class="cert-card">
      <img src="cert2.jpg" alt="Certificate 2">
      <p>Data Analytics Workshop</p>
    </div>

    <div class="cert-card">
      <img src="cert3.jpg" alt="Certificate 3">
      <p>UI/UX Design Bootcamp</p>
    </div>

    <div class="cert-card">
      <img src="cert4.jpg" alt="Certificate 4">
      <p>Python for Beginners</p>
    </div>

    <div class="cert-card">
      <img src="cert5.jpg" alt="Certificate 5">
      <p>React & JavaScript Essentials</p>
    </div>
  </div>

  <a href="project.html" class="back-button">⬅ Back to Project</a>

  <footer>
    &copy; 2025 Edmer John D. Pino. All rights reserved.
  </footer>
</body>
</html>
