<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artworks</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: var(--blue-1);
      margin: 0;
      padding: 2rem;
      text-align: center;
    }

    h2 {
      color: var(--blue-5);
      margin-bottom: 2rem;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
    }

    .gallery img {
      max-width: 100%;
      height: auto;
      max-height: 400px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
    }

    .back-button {
      display: inline-block;
      margin-top: 2rem;
      text-decoration: none;
      background-color: var(--blue-4);
      color: white;
      padding: 0.7rem 1.4rem;
      border-radius: 5px;
      font-weight: bold;
      transition: 0.3s;
    }

    .back-button:hover {
      background-color: var(--blue-5);
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      cursor: zoom-out;
    }

    .modal-content {
      max-width: 90%;
      max-height: 90vh;
      object-fit: contain;
      cursor: grab;
      position: absolute;
      top: 50%;
      left: 50%;
      margin: 0;
      padding: 0;
    }

    .modal-content.zoomed {
      cursor: grab;
    }

    .modal-content.dragging {
      cursor: grabbing;
    }

    .close {
      position: absolute;
      top: 15px;
      right: 35px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1001;
    }

    .close:hover,
    .close:focus {
      color: #bbb;
      text-decoration: none;
    }

    /* Upload/Download controls */
    .controls {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      gap: 10px;
    }

    .control-btn {
      background-color: var(--blue-4);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .control-btn:hover {
      background-color: var(--blue-5);
    }

    #upload-input {
      display: none;
    }

    /* Login Modal */
    .login-modal {
      display: flex;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.95);
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 150, 255, 0.5);
      text-align: center;
      width: 90%;
      max-width: 400px;
    }

    .login-container h2 {
      color: var(--blue-5);
      margin-top: 0;
    }

    .login-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 1rem;
    }

    .login-btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.3s;
    }

    .login-btn.guest {
      background-color: #6c757d;
      color: white;
    }

    .login-btn.guest:hover {
      background-color: #5a6268;
    }

    .login-btn.admin {
      background-color: var(--blue-4);
      color: white;
    }

    .login-btn.admin:hover {
      background-color: var(--blue-5);
    }

    .password-section {
      display: none;
      margin-top: 1rem;
    }

    .password-section.active {
      display: block;
    }

    .password-section input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 2px solid var(--blue-3);
      border-radius: 5px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .password-section input:focus {
      outline: none;
      border-color: var(--blue-5);
      box-shadow: 0 0 5px rgba(0, 150, 255, 0.3);
    }

    .password-actions {
      display: flex;
      gap: 10px;
    }

    .password-actions button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .password-actions .submit-btn {
      background-color: var(--blue-4);
      color: white;
    }

    .password-actions .submit-btn:hover {
      background-color: var(--blue-5);
    }

    .password-actions .cancel-btn {
      background-color: #ddd;
      color: #333;
    }

    .password-actions .cancel-btn:hover {
      background-color: #bbb;
    }

    /* User info bar */
    .user-info {
      position: fixed;
      top: 20px;
      left: 20px;
      background-color: var(--blue-4);
      color: white;
      padding: 10px 15px;
      border-radius: 5px;
      z-index: 100;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .user-info span {
      font-weight: bold;
    }

    .logout-btn {
      background-color: rgba(255, 255, 255, 0.3);
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .logout-btn:hover {
      background-color: rgba(255, 255, 255, 0.5);
    }

    /* Delete button for images */
    .delete-btn {
      background-color: rgba(255, 59, 48, 0.9) !important;
      color: white !important;
      font-size: 20px !important;
    }

    .delete-btn:hover {
      background-color: rgba(255, 0, 0, 0.9) !important;
    }
  </style>
</head>
<body>
  <!-- Login Modal -->
  <div class="login-modal" id="loginModal">
    <div class="login-container">
      <h2>🎨 Welcome to Artworks</h2>
      <p>Select your role:</p>
      <div class="login-buttons">
        <button class="login-btn guest" id="guestBtn" type="button">👤 Guest</button>
        <button class="login-btn admin" id="adminBtn" type="button">🔐 Admin</button>
      </div>
      <div class="password-section" id="passwordSection">
        <input type="password" id="passwordInput" placeholder="Enter admin password">
        <div class="password-actions">
          <button class="submit-btn" id="submitPasswordBtn" type="button">Submit</button>
          <button class="cancel-btn" id="cancelPasswordBtn" type="button">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- User Info Bar -->
  <div class="user-info" id="userInfo" style="display: none;">
    <span>Role: <span id="roleDisplay">Guest</span></span>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>

  <h2>🎨 My Artworks</h2>

  <!-- Upload/Download Controls -->
  <div class="controls">
    <button class="control-btn" id="upload-btn" style="display: none;">📤 Upload Image</button>
    <input type="file" id="upload-input" accept="image/*" multiple>
  </div>

  <div class="gallery">
    <img src="IMG20210407103721.jpg" alt="Artwork 0">
    <img src="IMG20220125143931.jpg" alt="Artwork 1">
    <img src="IMG20220413123459.jpg" alt="Artwork 2">
    <img src="IMG20230603083344.jpg" alt="Artwork 3">
    <img src="IMG20230618110003.jpg" alt="Artwork 4">
    <img src="IMG20240626121345.jpg" alt="Artwork 5">
    <img src="Picsart_24-07-25_16-15-31-017.jpg" alt="Artwork 6">
    <img src="Picsart_24-04-21_11-48-12-731.jpg" alt="Artwork 7">
    <img src="Picsart_23-09-03_12-09-16-930.jpg" alt="Artwork 8">
    <img src="PicsArt_11-07-02.31.43.jpg" alt="Artwork 9">
    <img src="PicsArt_11-06-05.08.10.jpg" alt="Artwork 10">
    <img src="PicsArt_11-05-05.07.36.jpg" alt="Artwork 11">
    <img src="Picsart_25-09-20_11-54-25-309.jpg" alt="Artwork 12">
    <img src="Picsart_25-10-12_14-39-49-854.jpg" alt="Artwork 13">
    <img src="Picsart_25-10-25_13-31-13-084.jpg" alt="Artwork 14">
  </div>

  <!-- Modal for image zoom -->
  <div id="imageModal" class="modal">
    <span class="close">&times;</span>
    <img class="modal-content" id="modalImage" alt="Zoomed Image">
  </div>

  <a href="project.html" class="back-button">⬅ Back to Project</a>
  <script src="script.js"></script>
</body>
<footer>

</footer>
</html>
